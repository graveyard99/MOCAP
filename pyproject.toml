[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openmocap-vfx"
version = "0.1.0"
description = "Geometry-first asynchronous multi-camera motion capture for VFX"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "numpy==2.2.6", "scipy==1.15.3", "opencv-contrib-python-headless==4.11.0.86",
  "PySide6==6.8.3", "PyYAML==6.0.2", "pillow==11.2.1", "onnxruntime==1.22.0",
]

[project.scripts]
openmocap = "openmocap.cli:main"
openmocap-gui = "openmocap.ui:main"

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13", "pre-commit==4.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/openmocap"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
